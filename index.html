<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Comercial · Premium Filme</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07060f;
  --surface:#0f0d1c;
  --surface2:#161428;
  --border:rgba(255,255,255,0.07);
  --border-glow:rgba(107,47,224,0.35);
  --purple:#7B3FF5;
  --purple-bright:#9B6BFF;
  --purple-dim:rgba(107,47,224,0.12);
  --text:#f2eeff;
  --muted:#8a85a0;
  --accent:#c4b0ff;
  --green:#4ade80;
  --yellow:#fbbf24;
  --red:#f87171;
  --blue:#60a5fa;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}

.sidebar{
  background:rgba(10,7,22,0.98);
  border-right:1px solid var(--border);
  padding:1.75rem 1.25rem;
  display:flex;flex-direction:column;gap:2px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem;}
.logo-mark{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--purple),var(--purple-bright));
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:#fff;
  box-shadow:0 0 16px rgba(123,63,245,.55);
}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:0.95rem;line-height:1.2;}
.logo-sub{font-size:10px;color:var(--muted);font-weight:400;}
.nav-section{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:1.25rem 10px 6px;opacity:.6;}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:rgba(255,255,255,.5);transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;}
.nav-item:active{transform:scale(.97);}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.05);}
.nav-item.active{color:var(--text);background:var(--purple-dim);border:1px solid var(--border-glow);}
.nav-item svg{flex-shrink:0;opacity:.6;}
.nav-item.active svg{opacity:1;}

.main{display:flex;flex-direction:column;min-height:100vh;}

.topbar{
  background:rgba(10,7,22,0.95);
  border-bottom:1px solid var(--border);
  padding:.9rem 2rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);
  gap:1rem;flex-wrap:wrap;
}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

.sel-wrap{position:relative;}
.sel-wrap select{
  appearance:none;-webkit-appearance:none;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:7px 30px 7px 12px;font-size:12px;color:var(--text);
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:border-color .15s;
}
.sel-wrap select:focus{outline:none;border-color:var(--purple);}
.sel-wrap::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted);pointer-events:none;}

.mes-dropdown{position:relative;}
.mes-dropdown-btn{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:7px 10px 7px 12px;font-size:12px;color:var(--text);font-weight:500;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .15s;
}
.mes-dropdown-btn svg.cal-icon{color:var(--purple-bright);flex-shrink:0;opacity:.9;}
.mes-dropdown-btn:hover{border-color:var(--border-glow);box-shadow:0 0 0 3px rgba(123,63,245,.08);}
.mes-dropdown-btn:active{transform:scale(.97);}
.mes-dropdown-btn.open{border-color:var(--purple);box-shadow:0 0 0 3px rgba(123,63,245,.14);}
.mes-dropdown-chev{transition:transform .25s cubic-bezier(.22,1,.36,1);color:var(--muted);}
.mes-dropdown-chev.open{transform:rotate(180deg);color:var(--purple-bright);}
.mes-dropdown-panel{
  position:absolute;top:calc(100% + 8px);right:0;min-width:220px;
  background:var(--surface2);border:1px solid var(--border-glow);border-radius:14px;
  padding:.7rem;z-index:100;box-shadow:0 20px 45px rgba(0,0,0,.5),0 0 0 1px rgba(155,107,255,.05);
  max-height:380px;overflow-y:auto;
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top right;
  transition:opacity .2s ease,transform .2s cubic-bezier(.22,1,.36,1),visibility 0s linear .2s;
}
.mes-dropdown-panel::-webkit-scrollbar{width:4px;}
.mes-dropdown-panel::-webkit-scrollbar-thumb{background:var(--purple);border-radius:3px;}
.mes-dropdown-panel.open{
  opacity:1;visibility:visible;transform:translateY(0) scale(1);
  transition:opacity .2s ease,transform .2s cubic-bezier(.22,1,.36,1),visibility 0s;
}
.mes-dropdown-actions{display:flex;gap:6px;margin-bottom:.6rem;padding-bottom:.6rem;border-bottom:1px solid var(--border);}
.mes-dropdown-actions button{
  flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:7px;
  color:var(--text);font-size:10.5px;font-weight:600;padding:6px 6px;cursor:pointer;
  font-family:'Syne',sans-serif;letter-spacing:.02em;transition:background .15s,border-color .15s,transform .12s;
}
.mes-dropdown-actions button:hover{background:var(--purple-dim);border-color:var(--border-glow);}
.mes-dropdown-actions button:active{transform:scale(.94);}
.mes-dropdown-item{
  display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;
  font-size:12.5px;color:var(--text);transition:background .15s;position:relative;
}
.mes-dropdown-item:hover{background:rgba(255,255,255,.06);}
.mes-dropdown-item.checked{background:var(--purple-dim);color:var(--purple-bright);font-weight:600;}
.mes-chk{
  width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;background:rgba(255,255,255,.03);
}
.mes-dropdown-item.checked .mes-chk{background:var(--purple);border-color:var(--purple);}
.mes-chk svg{width:10px;height:10px;opacity:0;transform:scale(.5);transition:all .15s;color:#fff;}
.mes-dropdown-item.checked .mes-chk svg{opacity:1;transform:scale(1);}
.mes-dropdown-item input{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}

.btn-refresh{background:var(--purple);border:none;border-radius:8px;padding:7px 14px;color:#fff;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
.btn-refresh:active{transform:scale(.95);}
.btn-refresh:hover{background:var(--purple-bright);transform:translateY(-1px);}
.btn-refresh.spinning svg{animation:spin 1s linear infinite;}
.last-sync{font-size:10px;color:var(--muted);}

.content{padding:1.75rem 2rem;flex:1;}
.page{display:none;animation:fadeUp .3s ease forwards;}
.page.active{display:block;}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:1.2rem;position:relative;overflow:hidden;
  transition:transform .2s cubic-bezier(.22,1,.36,1),border-color .2s,box-shadow .2s;
}
.stat-card:hover{transform:translateY(-3px);border-color:var(--border-glow);box-shadow:0 10px 28px rgba(0,0,0,.35);}
.anim-in .stat-card{animation:fadeUp .45s cubic-bezier(.22,1,.36,1) backwards;}
.anim-in .stat-card:nth-child(1){animation-delay:.01s;}
.anim-in .stat-card:nth-child(2){animation-delay:.06s;}
.anim-in .stat-card:nth-child(3){animation-delay:.11s;}
.anim-in .stat-card:nth-child(4){animation-delay:.16s;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--purple),transparent);}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
.stat-value{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;line-height:1;}
.stat-value.green{color:var(--green);}
.stat-value.yellow{color:var(--yellow);}
.stat-value.red{color:var(--red);}
.stat-value.purple{color:var(--purple-bright);}
.stat-value.blue{color:var(--blue);}
.stat-sub{font-size:10.5px;color:var(--muted);margin-top:5px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;margin-bottom:1.2rem;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s;}
.card:hover{border-color:var(--border-glow);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.anim-in .card{animation:fadeUp .4s cubic-bezier(.22,1,.36,1) backwards;}
.anim-in .grid2 .card:nth-child(2),.anim-in .grid3 .card:nth-child(2){animation-delay:.05s;}
.anim-in .grid3 .card:nth-child(3){animation-delay:.1s;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(155,107,255,.35),transparent);}
.card-title{font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:1rem;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

.meta-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem;}
.meta-values{font-size:13px;color:var(--muted);}
.meta-values strong{color:var(--text);font-weight:600;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:'Syne',sans-serif;}
.b-green{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.3);}
.b-yellow{background:rgba(251,191,36,.15);color:var(--yellow);border:1px solid rgba(251,191,36,.3);}
.b-red{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.b-blue{background:rgba(96,165,250,.15);color:var(--blue);border:1px solid rgba(96,165,250,.3);}
.b-purple{background:var(--purple-dim);color:var(--purple-bright);border:1px solid var(--border-glow);}

.pb{background:rgba(255,255,255,.06);border-radius:99px;height:8px;overflow:hidden;margin:8px 0;}
.pf{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.22,1,.36,1);}

.meta-sub{font-size:11px;color:var(--muted);margin-top:4px;}

.meta-input-row{display:flex;align-items:center;gap:8px;margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--border);}
.meta-input-row label{font-size:11px;color:var(--muted);}
.meta-input-row input{
  background:var(--surface2);border:1px solid var(--border);border-radius:7px;
  padding:5px 9px;font-size:12px;color:var(--text);font-family:'DM Sans',sans-serif;width:120px;
}
.meta-input-row input:focus{outline:none;border-color:var(--purple);}

.sprint-row{display:grid;grid-template-columns:90px 1fr 90px 80px;gap:10px;align-items:center;margin-bottom:10px;}
.sprint-lbl{font-size:12px;color:var(--muted);}
.sprint-val{font-size:13px;font-weight:600;text-align:right;}

.sprint-block{margin-bottom:1.5rem;}
.sprint-block:last-child{margin-bottom:0;}

.funil-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.funil-lbl{font-size:11px;color:var(--muted);width:100px;flex-shrink:0;text-align:right;}
.funil-wrap{flex:1;background:rgba(255,255,255,.05);border-radius:99px;height:26px;overflow:hidden;}
.funil-fill{height:100%;border-radius:99px;display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:600;min-width:30px;transition:width .8s cubic-bezier(.22,1,.36,1);}
.funil-pct{font-size:11px;color:var(--muted);width:36px;text-align:right;flex-shrink:0;}

.bar-item{margin-bottom:10px;}
.bar-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;}
.bar-val{font-weight:600;color:var(--text);font-family:'Syne',sans-serif;}

.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);}
.tbl td{font-size:12.5px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text);vertical-align:top;}
.tbl tr:hover td{background:rgba(255,255,255,.02);}
.tbl td.muted{color:var(--muted);}

.search-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem;}
.search-row input{
  background:var(--surface2);border:1px solid var(--border);border-radius:9px;
  padding:8px 12px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;width:220px;
}
.search-row input:focus{outline:none;border-color:var(--purple);}
.search-row input::placeholder{color:var(--muted);}

.cli-grid{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start;}
.cli-list{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow-y:auto;padding-right:4px;}
.cli-list::-webkit-scrollbar{width:3px;}
.cli-list::-webkit-scrollbar-thumb{background:var(--purple);border-radius:2px;}
.cli-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;transition:all .15s;}
.cli-item:active{transform:scale(.98);}
.cli-item:hover{border-color:var(--border-glow);background:var(--purple-dim);}
.cli-item.active{border-color:var(--purple);background:var(--purple-dim);}
.cli-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.cli-sub{font-size:10px;color:var(--muted);margin-top:2px;}
.cli-val{font-size:12px;font-weight:600;color:var(--green);margin-top:3px;}
.detail-card{background:var(--surface);border:1px solid var(--border-glow);border-radius:14px;padding:1.4rem;}
.detail-row{margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border);}
.detail-row:last-child{border:none;margin:0;padding:0;}
.detail-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px;}
.detail-value{font-size:13px;color:var(--text);line-height:1.6;}

.empty{text-align:center;padding:4rem 1rem;}
.empty-icon{font-size:2.5rem;margin-bottom:.75rem;opacity:.4;}
.empty-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;color:var(--muted);}
.empty-sub{font-size:12px;color:var(--muted);opacity:.7;margin-top:.4rem;}

.section-title{font-family:'Syne',sans-serif;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:1.5rem 0 .75rem;}

.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;}
.drawer-overlay.open{opacity:1;pointer-events:all;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:95vw;background:var(--surface);border-left:1px solid var(--border-glow);z-index:201;transform:translateX(100%);transition:transform .28s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-header{padding:1.4rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-shrink:0;}
.drawer-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;}
.drawer-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.drawer-close{background:rgba(255,255,255,.07);border:none;border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0;transition:all .15s;}
.drawer-close:active{transform:scale(.9) rotate(90deg);}
.drawer-close:hover{background:rgba(255,255,255,.12);color:var(--text);}
.drawer-body{flex:1;overflow-y:auto;padding:1rem 1.5rem;}
.drawer-body::-webkit-scrollbar{width:3px;}
.drawer-body::-webkit-scrollbar-thumb{background:var(--purple);border-radius:2px;}
.drawer-card{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:1rem 1.1rem;margin-bottom:.7rem;cursor:pointer;transition:border-color .15s;}
.drawer-card:hover{border-color:var(--border-glow);}
.drawer-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem;}
.drawer-card-name{font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;}
.drawer-card-val{font-weight:700;color:var(--green);font-family:'Syne',sans-serif;}
.drawer-card-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:.3rem;}
.drawer-tag{font-size:10px;color:var(--muted);background:rgba(255,255,255,.05);border-radius:4px;padding:2px 7px;}
.drawer-expanded{margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.drawer-field{font-size:11px;}
.drawer-field-label{color:var(--muted);margin-bottom:2px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;}
.drawer-field-value{color:var(--text);line-height:1.5;}

.clickable-row{cursor:pointer;transition:all .15s;}
.clickable-row:hover td{background:rgba(155,107,255,.08)!important;}
.clickable-row:hover td:first-child{color:var(--purple-bright);}
.bar-item.clickable{cursor:pointer;padding:4px 6px;border-radius:7px;margin-left:-6px;margin-right:-6px;transition:background .15s;}
.bar-item.clickable:hover{background:rgba(155,107,255,.08);}
.stat-card.clickable{cursor:pointer;transition:all .2s;}
.stat-card.clickable:hover{border-color:var(--border-glow);transform:translateY(-2px);}

@media(max-width:900px){
  .shell{grid-template-columns:1fr;}
  .sidebar{height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:1rem;}
  .stats-row{grid-template-columns:1fr 1fr;}
  .grid2,.grid3{grid-template-columns:1fr;}
  .cli-grid{grid-template-columns:1fr;}
  .sprint-row{grid-template-columns:70px 1fr 70px 70px;}
  .drawer{width:100vw;}
}
</style>

<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div>
      <div class="drawer-title" id="drawer-title">—</div>
      <div class="drawer-sub" id="drawer-sub">—</div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>
</head>
<body>
<div class="shell">

<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">PF</div>
    <div class="logo-text">Premium Filme<span class="logo-sub" style="display:block">Comercial Dashboard</span></div>
  </div>

  <div class="nav-section">Visão Geral</div>
  <button class="nav-item active" id="nav-dashboard" onclick="goPage('dashboard',this)">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Dashboard
  </button>
  <button class="nav-item" id="nav-metas" onclick="goPage('metas',this)">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
    Metas & Sprints
  </button>

  <div class="nav-section">Operação</div>
  <button class="nav-item" id="nav-clientes" onclick="goPage('clientes',this)">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
    Clientes / Leads
  </button>
  <button class="nav-item" id="nav-canais" onclick="goPage('canais',this)">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    Canais & Produtos
  </button>
</aside>

<div class="main">

  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-title" id="topbar-title">Dashboard Comercial</span>
    </div>
    <div class="topbar-right">
      <div class="sel-wrap">
        <select id="selStatus" onchange="onFilterChange()">
          <option value="all">Todos os registros</option>
          <option value="fechado">Só vendas fechadas</option>
          <option value="lead">Só leads (sem venda)</option>
        </select>
      </div>
      <div class="mes-dropdown" id="mesDropdown">
        <button class="mes-dropdown-btn" id="btnMesDropdown" onclick="toggleMesDropdown(event)">
          <svg class="cal-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span id="mesDropdownLabel">Todos os meses</span>
          <svg class="mes-dropdown-chev" id="mesDropdownChev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="mes-dropdown-panel" id="mesDropdownPanel">
          <div class="mes-dropdown-actions">
            <button onclick="selecionarTodosMeses()">Todos os meses</button>
            <button onclick="limparMeses()">Limpar</button>
          </div>
          <div id="mesDropdownList"></div>
        </div>
      </div>
      <button class="btn-refresh" id="btn-refresh" onclick="loadAll()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
        Recarregar
      </button>
      <span class="last-sync" id="last-sync"></span>
    </div>
  </div>

  <div class="content">

    <div class="page active" id="pg-dashboard"></div>
    <div class="page" id="pg-metas"></div>
    <div class="page" id="pg-clientes"></div>
    <div class="page" id="pg-canais"></div>

  </div>
</div>
</div>

<script>

// ── DADOS (direto da planilha Google, ao vivo) ────────────────────
// Mesma planilha que o formulário/n8n já alimenta. Lida pelo endpoint gviz
// (sem credencial — a aba precisa estar compartilhada "qualquer pessoa com
// o link pode ver"), direto do navegador, a cada carregamento/"Recarregar".
const SHEET_ID = '11z1DJ4LdBf5tALN11m5NQ2NzG_vGczIq0B9DJga34VM';
const SHEET_GID = '0';

const MESES_PT_FULL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function parseGvizDate(cell) {
  // Célula de data do gviz vem como {v: "Date(2026,5,30)"} (mês 0-indexado) ou null/vazia.
  if(!cell || cell.v == null) return null;
  const m = /^Date\((\d+),(\d+),(\d+)\)$/.exec(String(cell.v));
  if(!m) return null;
  const d = new Date(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]));
  return isNaN(d.getTime()) ? null : d;
}
function cellStr(cell) {
  if(!cell || cell.v == null) return '';
  return String(cell.f || cell.v).trim();
}
function cellNum(cell) {
  if(!cell || cell.v == null) return 0;
  const n = Number(cell.v);
  return Number.isFinite(n) ? n : 0;
}

function parseLinhasPlanilha(json) {
  const linhas = (json.table && json.table.rows) || [];
  return linhas.map(linha => {
    const c = linha.c || [];
    const nome = cellStr(c[0]);
    if(!nome) return null;
    const tel = cellStr(c[1]);
    const email = cellStr(c[2]);
    const dataVenda = parseGvizDate(c[6]);
    const dataEntrada = parseGvizDate(c[7]);
    const dataRef = dataVenda || dataEntrada || null;
    const valor = cellNum(c[5]);
    return {
      nome,
      tel: tel === 'Não cadastrado' ? '' : tel,
      email: email === 'Não cadastrado' ? '' : email,
      canal: cellStr(c[3]) || 'Não informado',
      produto: cellStr(c[4]) || 'Não informado',
      tipoPelicula: cellStr(c[9]) || 'Não informado',
      anuncio: cellStr(c[8]) || 'Não informado',
      valor,
      fechado: valor > 0,
      dataVenda, dataEntrada, dataRef,
      mesKey: dataRef ? `${dataRef.getFullYear()}-${String(dataRef.getMonth()+1).padStart(2,'0')}` : 'SEM_DATA',
    };
  }).filter(Boolean);
}

async function buscarPlanilha() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${SHEET_GID}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('planilha respondeu ' + res.status);
  const texto = await res.text();
  const match = /\{.*\}/s.exec(texto);
  if(!match) throw new Error('resposta da planilha não veio no formato esperado');
  const json = JSON.parse(match[0]);
  if(json.status === 'error') throw new Error('planilha recusou a consulta');
  return parseLinhasPlanilha(json);
}

let DATA = [];
let MESES_DISPONIVEIS = [];

// Meses realmente presentes nos dados (ordenados cronologicamente, com "Sem data" por último)
function computeMesesDisponiveis() {
  const set = new Set(DATA.map(r => r.mesKey));
  const comData = Array.from(set).filter(k => k !== 'SEM_DATA').sort();
  const lista = comData.map(k => {
    const [y,m] = k.split('-');
    return { key: k, label: `${MESES_PT_FULL[parseInt(m)-1]}/${y}` };
  });
  if(set.has('SEM_DATA')) lista.push({ key: 'SEM_DATA', label: 'Sem data' });
  MESES_DISPONIVEIS = lista;
}

// Meta por mês (editável, persiste no navegador)
const META_PADRAO = 10000;
const STORAGE_KEY = 'premiumfilme_metas_v1';
function loadMetas() {
  try { const s = localStorage.getItem(STORAGE_KEY); if(s) return JSON.parse(s); } catch(e) {}
  return {};
}
function saveMetas() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(METAS)); } catch(e) {} }
const METAS = loadMetas();
function getMetaMes(key) { return METAS[key] != null ? METAS[key] : META_PADRAO; }
function setMetaMes(key, val) { METAS[key] = parseFloat(val) || META_PADRAO; saveMetas(); }

// ── HELPERS ──────────────────────────────────────────────────────
const fmt = n => n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtK = n => n >= 1000 ? 'R$' + (n/1000).toFixed(2) + 'k' : 'R$' + fmt(n);
const fmtDate = d => d ? d.toLocaleDateString('pt-BR') : '—';

function animarBarras(root) {
  root = root || document;
  requestAnimationFrame(() => {
    root.querySelectorAll('[data-w]').forEach(el => {
      requestAnimationFrame(() => { el.style.width = el.dataset.w; });
    });
  });
}

function animarNumero(el, valorFinal, formatter, duracao) {
  if(!el) return;
  duracao = duracao || 900;
  const inicio = performance.now();
  function passo(agora) {
    const t = Math.min((agora - inicio) / duracao, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = formatter(valorFinal * eased);
    if(t < 1) requestAnimationFrame(passo);
    else el.textContent = formatter(valorFinal);
  }
  requestAnimationFrame(passo);
}

let SUPPRESS_ENTRANCE = false;
function renderSemAnimarEntrada(fn) {
  SUPPRESS_ENTRANCE = true;
  fn();
  SUPPRESS_ENTRANCE = false;
}

// ── FILTROS ──────────────────────────────────────────────────────
let MESES_SELECIONADOS = []; // preenchido depois do primeiro carregamento da planilha

function getStatus() { return document.getElementById('selStatus').value; }

function labelMeses() {
  const sel = MESES_SELECIONADOS;
  if(!sel.length) return 'Nenhum mês';
  if(sel.length === MESES_DISPONIVEIS.length) return 'Todos os meses';
  if(sel.length <= 2) return sel.map(k => (MESES_DISPONIVEIS.find(m=>m.key===k)||{}).label).join(' + ');
  return `${sel.length} meses`;
}

function toggleMesDropdown(e) {
  if(e) e.stopPropagation();
  const isOpen = document.getElementById('mesDropdownPanel').classList.toggle('open');
  document.getElementById('mesDropdownChev').classList.toggle('open', isOpen);
  document.getElementById('btnMesDropdown').classList.toggle('open', isOpen);
}
function closeMesDropdown() {
  document.getElementById('mesDropdownPanel').classList.remove('open');
  document.getElementById('mesDropdownChev').classList.remove('open');
  document.getElementById('btnMesDropdown').classList.remove('open');
}
document.addEventListener('click', (e) => {
  const panel = document.getElementById('mesDropdownPanel');
  const btn = document.getElementById('btnMesDropdown');
  if(panel && panel.classList.contains('open') && !panel.contains(e.target) && !btn.contains(e.target)) {
    closeMesDropdown();
  }
});

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

function renderMesDropdownList() {
  const list = document.getElementById('mesDropdownList');
  if(!list) return;
  list.innerHTML = MESES_DISPONIVEIS.map(m => `
      <label class="mes-dropdown-item${MESES_SELECIONADOS.includes(m.key)?' checked':''}" data-mes="${m.key}">
        <input type="checkbox" value="${m.key}" ${MESES_SELECIONADOS.includes(m.key)?'checked':''} onchange="onMesCheckboxChange()">
        <span class="mes-chk">${CHECK_SVG}</span>
        ${m.label}
      </label>`).join('');
}

function onMesCheckboxChange() {
  const checks = document.querySelectorAll('#mesDropdownList input[type=checkbox]');
  MESES_SELECIONADOS = Array.from(checks).filter(c => c.checked).map(c => c.value);
  document.querySelectorAll('#mesDropdownList .mes-dropdown-item').forEach(label => {
    label.classList.toggle('checked', MESES_SELECIONADOS.includes(label.dataset.mes));
  });
  document.getElementById('mesDropdownLabel').textContent = labelMeses();
  renderAll();
}

function selecionarTodosMeses() {
  MESES_SELECIONADOS = MESES_DISPONIVEIS.map(m => m.key);
  renderMesDropdownList();
  document.getElementById('mesDropdownLabel').textContent = labelMeses();
  renderAll();
}

function limparMeses() {
  MESES_SELECIONADOS = [];
  renderMesDropdownList();
  document.getElementById('mesDropdownLabel').textContent = labelMeses();
  renderAll();
}

function getData() {
  const status = getStatus();
  return DATA.filter(r => {
    if(!MESES_SELECIONADOS.includes(r.mesKey)) return false;
    if(status === 'fechado' && !r.fechado) return false;
    if(status === 'lead' && r.fechado) return false;
    return true;
  });
}

function getMeta() {
  return MESES_SELECIONADOS.filter(k => k !== 'SEM_DATA').reduce((s,k) => s + getMetaMes(k), 0);
}

function onFilterChange() { renderAll(); }

// ── NAVIGATION ───────────────────────────────────────────────────
function goPage(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('pg-' + id).classList.add('active');
  el.classList.add('active');
  const titles = {dashboard:'Dashboard Comercial', metas:'Metas & Sprints', clientes:'Clientes / Leads', canais:'Canais & Produtos'};
  document.getElementById('topbar-title').textContent = titles[id] || id;
  renderPage(id);
}

let PRIMEIRA_CARGA = true;
async function loadAll() {
  const btn = document.getElementById('btn-refresh');
  btn.classList.add('spinning');
  try {
    DATA = await buscarPlanilha();
    computeMesesDisponiveis();
    const chavesValidas = new Set(MESES_DISPONIVEIS.map(m => m.key));
    if(PRIMEIRA_CARGA) {
      MESES_SELECIONADOS = MESES_DISPONIVEIS.map(m => m.key);
      PRIMEIRA_CARGA = false;
    } else {
      MESES_SELECIONADOS = MESES_SELECIONADOS.filter(k => chavesValidas.has(k));
    }
    renderMesDropdownList();
    document.getElementById('mesDropdownLabel').textContent = labelMeses();
    document.getElementById('last-sync').textContent = 'Planilha: ' + DATA.length + ' registros · ' + new Date().toLocaleTimeString('pt-BR');
  } catch(e) {
    console.error('Falha ao carregar a planilha:', e);
    document.getElementById('last-sync').textContent = 'Erro ao carregar a planilha (' + new Date().toLocaleTimeString('pt-BR') + ')';
    if(!DATA.length) {
      document.querySelectorAll('.page').forEach(p => {
        p.innerHTML = emptyHTML('⚠️','Não foi possível carregar a planilha', e.message || 'Verifique sua conexão e tente "Recarregar".');
      });
      btn.classList.remove('spinning');
      return;
    }
  }
  btn.classList.remove('spinning');
  renderAll();
}

function renderAll() {
  const active = document.querySelector('.page.active');
  if(!active) return;
  const id = active.id.replace('pg-','');
  renderPage(id);
}

function renderPage(id) {
  if(id === 'dashboard') renderDashboard();
  else if(id === 'metas') renderMetas();
  else if(id === 'clientes') renderClientes();
  else if(id === 'canais') renderCanais();
}

// ── DASHBOARD ────────────────────────────────────────────────────
function renderDashboard() {
  const rows = getData();
  const meta = getMeta();
  const mesesSel = MESES_SELECIONADOS;
  const mesUnico = (mesesSel.length === 1 && mesesSel[0] !== 'SEM_DATA') ? mesesSel[0] : null;

  if(!mesesSel.length) {
    document.getElementById('pg-dashboard').innerHTML = emptyHTML('📅','Nenhum mês selecionado','Escolha um ou mais meses no topo da página.');
    return;
  }
  if(!rows.length) {
    document.getElementById('pg-dashboard').innerHTML = emptyHTML('📊','Sem registros para ' + labelMeses(),'Ajuste os filtros de status ou período.');
    return;
  }

  const fechados = rows.filter(r => r.fechado);
  const rec = fechados.reduce((s,r) => s+r.valor, 0);
  const nLeads = rows.length;
  const nFechados = fechados.length;
  const taxaConv = nLeads ? Math.round(nFechados/nLeads*100) : 0;
  const tk = nFechados ? rec/nFechados : 0;
  const pctMeta = meta ? Math.min(Math.round(rec/meta*100), 100) : 0;
  const metaColor = pctMeta >= 100 ? 'green' : pctMeta >= 60 ? 'yellow' : 'red';
  const metaBadgeClass = pctMeta >= 100 ? 'b-green' : pctMeta >= 60 ? 'b-yellow' : 'b-red';

  const canais = {};
  fechados.forEach(r => { canais[r.canal] = (canais[r.canal]||0)+r.valor; });
  const topCanal = Object.entries(canais).sort((a,b)=>b[1]-a[1])[0]||['—',0];

  const metaInputHTML = mesUnico
    ? `<div class="meta-input-row">
        <label>Meta R$</label>
        <input type="number" id="db-meta-input" value="${getMetaMes(mesUnico)}" oninput="saveMetaInput(this.value)">
      </div>`
    : `<div class="meta-sub" style="margin-top:.75rem;">Selecione um único mês pra editar a meta.</div>`;

  const sprintsCardHTML = mesUnico
    ? `<div class="section-title">Breakdown Semanal (automático, pelas datas do CSV)</div>
       <div class="card">
         <div class="card-title">Sprints — Meta semanal R$${fmt(getMetaMes(mesUnico)/4)}</div>
         <div id="db-sprints"></div>
       </div>`
    : `<div class="section-title">Breakdown Semanal</div>
       <div class="card">
         <div class="meta-sub">Selecione um único mês pra ver o detalhamento semanal.</div>
       </div>`;

  const animCls = SUPPRESS_ENTRANCE ? '' : 'anim-in';

  document.getElementById('pg-dashboard').innerHTML = `
    <div class="stats-row ${animCls}">
      <div class="stat-card">
        <div class="stat-label">Receita Fechada</div>
        <div class="stat-value green" id="db-rec-val">R$0</div>
        <div class="stat-sub">${labelMeses()} · ${rows.length === DATA.length ? 'todos os registros' : getStatus()==='all' ? 'todos os registros' : getStatus()==='fechado' ? 'só fechados' : 'só leads'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Leads no Período</div>
        <div class="stat-value purple" id="db-nleads-val">0</div>
        <div class="stat-sub">${nFechados} fechado${nFechados!==1?'s':''} · ${taxaConv}% conversão</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Ticket Médio</div>
        <div class="stat-value blue" id="db-tk-val">R$0</div>
        <div class="stat-sub">por venda fechada</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Top Canal</div>
        <div class="stat-value yellow" style="font-size:1.1rem;margin-top:4px;">${topCanal[0]}</div>
        <div class="stat-sub">R$${fmtK(topCanal[1]).replace('R$','')} gerado</div>
      </div>
    </div>

    <div class="grid2 ${animCls}" style="margin-bottom:1.2rem">
      <div class="card">
        <div class="card-title">Meta do Período</div>
        <div class="meta-header">
          <div class="meta-values">
            <strong>R$${fmt(rec)}</strong> <span style="opacity:.5">/</span> R$${fmt(meta)}
          </div>
          <span class="badge ${metaBadgeClass}">${pctMeta}%</span>
        </div>
        <div class="pb"><div class="pf" id="db-metabar" data-w="${pctMeta}%" style="width:0%;background:var(--${metaColor});"></div></div>
        <div class="meta-sub">${pctMeta >= 100 ? '✓ Meta atingida!' : 'Faltam R$' + fmt(Math.max(meta - rec,0))}</div>
        ${metaInputHTML}
      </div>
      <div class="card">
        <div class="card-title">Funil por Canal (leads)</div>
        <div id="db-funil"></div>
      </div>
    </div>

    ${sprintsCardHTML}`;

  animarNumero(document.getElementById('db-rec-val'), rec, x => 'R$'+fmtK(x).replace('R$',''));
  animarNumero(document.getElementById('db-nleads-val'), nLeads, x => Math.round(x).toString());
  animarNumero(document.getElementById('db-tk-val'), tk, x => 'R$'+fmtK(x).replace('R$',''));
  animarBarras(document.getElementById('pg-dashboard'));

  const canalLeads = {};
  rows.forEach(r => { canalLeads[r.canal] = (canalLeads[r.canal]||0)+1; });
  const canal_entries = Object.entries(canalLeads).sort((a,b)=>b[1]-a[1]);
  const maxVal = canal_entries[0] ? canal_entries[0][1] : 1;
  const colors = ['#9B6BFF','#4ade80','#60a5fa','#fbbf24','#f87171','#f472b6'];
  document.getElementById('db-funil').innerHTML = canal_entries.map(([canal,cnt],i) => {
    const w = Math.max(Math.round(cnt/maxVal*100),8);
    return `
    <div class="funil-row">
      <span class="funil-lbl">${canal}</span>
      <div class="funil-wrap">
        <div class="funil-fill" data-w="${w}%" style="width:0%;background:${colors[i%colors.length]}33;color:${colors[i%colors.length]};border:1px solid ${colors[i%colors.length]}55;">
          ${cnt}
        </div>
      </div>
      <span class="funil-pct">${Math.round(cnt/nLeads*100)}%</span>
    </div>`;
  }).join('');
  animarBarras(document.getElementById('db-funil'));

  if(!mesUnico) return;
  const mes = mesUnico;
  const [y,m] = mes.split('-').map(Number);
  const vMeta = getMetaMes(mes);
  const vMetaSem = vMeta / 4;
  const faixas = [[1,7],[8,14],[15,21],[22,31]];
  const sprintLabels = ['Sem 1 (1–7)','Sem 2 (8–14)','Sem 3 (15–21)','Sem 4 (22–31)'];
  const spVals = faixas.map(([ini,fim]) => rows
    .filter(r => r.fechado && r.dataRef && r.dataRef.getFullYear()===y && (r.dataRef.getMonth()+1)===m && r.dataRef.getDate()>=ini && r.dataRef.getDate()<=fim)
    .reduce((s,r)=>s+r.valor,0));

  document.getElementById('db-sprints').innerHTML = `
    <div style="font-size:10px;color:var(--muted);margin-bottom:.75rem;">Realizado calculado a partir da Data da Venda (ou Data de Entrada) de cada registro fechado.</div>
    ${sprintLabels.map((lbl,i) => {
      const sv = spVals[i];
      const sp = vMetaSem ? Math.min(Math.round(sv/vMetaSem*100),100) : 0;
      const cl = sp>=100?'b-green':sp>=60?'b-yellow':'b-red';
      return `<div class="sprint-row" style="grid-template-columns:100px 1fr 110px 90px;margin-bottom:8px;">
        <span class="sprint-lbl">${lbl}</span>
        <div class="pb" style="margin:0"><div class="pf" data-w="${sp}%" style="width:0%;background:var(--purple);"></div></div>
        <span class="sprint-val">R$${fmt(sv)}</span>
        <span class="badge ${cl}" style="font-size:10px;">${sp>=100?'Atingida':sp>=60?'Andamento':'Atenção'}</span>
      </div>`;
    }).join('')}`;
  animarBarras(document.getElementById('db-sprints'));
}

function saveMetaInput(val) {
  if(MESES_SELECIONADOS.length !== 1) return;
  setMetaMes(MESES_SELECIONADOS[0], val);
  renderSemAnimarEntrada(renderDashboard);
}

// ── METAS ────────────────────────────────────────────────────────
function renderMetas() {
  const mesesSel = MESES_SELECIONADOS;
  const mesUnico = (mesesSel.length === 1 && mesesSel[0] !== 'SEM_DATA') ? mesesSel[0] : null;
  const rows = getData();
  const fechados = rows.filter(r => r.fechado);
  const meta = getMeta();
  const rec = fechados.reduce((s,r) => s+r.valor, 0);
  const diasMes = 30 * mesesSel.filter(k=>k!=='SEM_DATA').length;
  const metaDia = diasMes ? meta / diasMes : 0;
  const metaSem = meta / 4;

  if(!mesesSel.length) {
    document.getElementById('pg-metas').innerHTML = emptyHTML('📅','Nenhum mês selecionado','Escolha um ou mais meses no topo da página.');
    return;
  }

  const animCls = SUPPRESS_ENTRANCE ? '' : 'anim-in';

  document.getElementById('pg-metas').innerHTML = `
    <div class="stats-row ${animCls}">
      <div class="stat-card">
        <div class="stat-label">Meta do Período</div>
        <div class="stat-value purple">R$${fmtK(meta).replace('R$','')}</div>
        <div class="stat-sub">${labelMeses()}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Meta Semanal</div>
        <div class="stat-value blue">R$${fmtK(metaSem).replace('R$','')}</div>
        <div class="stat-sub">${mesUnico ? 'meta do mês / 4 semanas' : 'meta total / 4 (referência)'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Meta Diária</div>
        <div class="stat-value yellow">R$${fmtK(metaDia).replace('R$','')}</div>
        <div class="stat-sub">meta / ${diasMes||'–'} dias</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Realizado</div>
        <div class="stat-value green">R$${fmtK(rec).replace('R$','')}</div>
        <div class="stat-sub">${meta ? Math.round(rec/meta*100) : 0}% da meta</div>
      </div>
    </div>

    <div class="section-title">Meta por Mês</div>
    <div class="grid3 ${animCls}">
      ${MESES_DISPONIVEIS.filter(m => m.key !== 'SEM_DATA').map(m => {
        const vRows = DATA.filter(r => r.mesKey === m.key && r.fechado);
        const vRec = vRows.reduce((s,r) => s+r.valor, 0);
        const vMeta = getMetaMes(m.key);
        const vPct = vMeta ? Math.min(Math.round(vRec/vMeta*100), 100) : 0;
        const vCl = vPct>=100?'b-green':vPct>=60?'b-yellow':'b-red';
        return `<div class="card">
          <div class="card-title">${m.label}</div>
          <div style="font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;color:var(--green);margin-bottom:.4rem;">R$${fmt(vRec)}</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:.6rem;">meta: R$${fmt(vMeta)}</div>
          <div class="pb"><div class="pf" data-w="${vPct}%" style="width:0%;background:var(--purple);"></div></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.5rem;">
            <span style="font-size:11px;color:var(--muted);">${vPct>=100?'✓ Meta atingida!':'Faltam R$'+fmt(Math.max(vMeta-vRec,0))}</span>
            <span class="badge ${vCl}">${vPct}%</span>
          </div>
          <div class="meta-input-row">
            <label>Meta</label>
            <input type="number" value="${vMeta}" oninput="saveMetaVendedorMes('${m.key}',this.value)">
          </div>
        </div>`;
      }).join('')}
    </div>

    ${mesUnico ? `
    <div class="section-title">Sprints Semanais — ${labelMeses()} (automático)</div>
    <div class="card">
      ${(() => {
        const [y,m] = mesUnico.split('-').map(Number);
        const vMeta = getMetaMes(mesUnico);
        const vMetaSem = vMeta / 4;
        const faixas = [[1,7],[8,14],[15,21],[22,31]];
        const labels = ['Sem 1 (1–7)','Sem 2 (8–14)','Sem 3 (15–21)','Sem 4 (22–31)'];
        const spVals = faixas.map(([ini,fim]) => DATA
          .filter(r => r.fechado && r.dataRef && r.dataRef.getFullYear()===y && (r.dataRef.getMonth()+1)===m && r.dataRef.getDate()>=ini && r.dataRef.getDate()<=fim)
          .reduce((s,r)=>s+r.valor,0));
        const spTotal = spVals.reduce((s,v2)=>s+v2,0);
        return `
        <div style="font-size:10px;color:var(--muted);margin-bottom:.75rem;">Calculado a partir da Data da Venda (ou Data de Entrada) de cada registro fechado neste mês.</div>
        ${labels.map((lbl,i) => {
          const sv = spVals[i];
          const sp = vMetaSem ? Math.min(Math.round(sv/vMetaSem*100),100) : 0;
          const cl = sp>=100?'b-green':sp>=60?'b-yellow':'b-red';
          return `<div class="sprint-row" style="grid-template-columns:95px 1fr 140px 85px;margin-bottom:10px;gap:10px;">
            <span class="sprint-lbl">${lbl}</span>
            <div class="pb" style="margin:0"><div class="pf" data-w="${sp}%" style="width:0%;background:var(--purple);"></div></div>
            <span class="sprint-val">R$${fmt(sv)}</span>
            <span class="badge ${cl}" style="font-size:10px;">${sp>=100?'✓ Atingida':sp>=60?'Andamento':'Atenção'}</span>
          </div>`;
        }).join('')}
        <div style="margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:12px;">
          <span style="color:var(--muted);">Total fechado nas semanas</span>
          <strong style="color:var(--green);">R$${fmt(spTotal)}</strong>
        </div>`;
      })()}
    </div>` : `
    <div class="section-title">Sprints Semanais</div>
    <div class="card"><div class="meta-sub">Selecione um único mês pra ver o detalhamento semanal.</div></div>`}`;

  animarBarras(document.getElementById('pg-metas'));
}

function saveMetaVendedorMes(mesKey, val) {
  setMetaMes(mesKey, val);
  renderSemAnimarEntrada(renderMetas);
}

// ── CLIENTES ─────────────────────────────────────────────────────
function renderClientes() {
  const rows = getData();
  if(!rows.length) {
    document.getElementById('pg-clientes').innerHTML = emptyHTML('👤','Sem registros para este período','');
    return;
  }

  document.getElementById('pg-clientes').innerHTML = `
    <div class="search-row">
      <input type="text" id="cli-search" placeholder="Buscar por nome..." oninput="filterClientes()">
      <span style="font-size:12px;color:var(--muted);" id="cli-count">${rows.length} registros</span>
    </div>
    <div class="cli-grid">
      <div class="cli-list" id="cli-list"></div>
      <div id="cli-detail"><div class="detail-card" style="text-align:center;padding:3rem;color:var(--muted);font-size:13px;">← Selecione um registro</div></div>
    </div>`;

  renderCliList(rows);
}

function filterClientes() {
  const q = document.getElementById('cli-search').value.toLowerCase();
  const rows = getData().filter(r => r.nome.toLowerCase().includes(q));
  document.getElementById('cli-count').textContent = rows.length + ' registros';
  renderCliList(rows);
}

function renderCliList(rows) {
  const list = document.getElementById('cli-list');
  if(!list) return;
  list.innerHTML = rows.map((r,i) => `
    <div class="cli-item" id="cli-${i}" onclick="showCliente(${i})">
      <div class="cli-name">${r.nome}</div>
      <div class="cli-sub">${r.canal} · ${r.produto}</div>
      <div class="cli-val" style="color:${r.fechado?'var(--green)':'var(--muted)'}">${r.fechado ? 'R$'+fmt(r.valor) : 'Sem fechamento'}</div>
    </div>`).join('');
  if(rows.length) showCliente(0);
}

function showCliente(i) {
  document.querySelectorAll('.cli-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('cli-' + i);
  if(el) el.classList.add('active');
  const rows = getData();
  const r = rows[i];
  if(!r) return;
  document.getElementById('cli-detail').innerHTML = `
    <div class="detail-card">
      <div class="detail-row">
        <div class="detail-label">Nome</div>
        <div class="detail-value" style="font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;">${r.nome}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Status</div>
        <div class="detail-value"><span class="badge ${r.fechado?'b-green':'b-yellow'}">${r.fechado ? 'Venda fechada' : 'Lead / sem fechamento'}</span></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Valor</div>
        <div class="detail-value" style="font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;color:${r.fechado?'var(--green)':'var(--muted)'};">R$${fmt(r.valor)}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Produto</div>
        <div class="detail-value">${r.produto}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Tipo de Película</div>
        <div class="detail-value">${r.tipoPelicula}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Canal de Origem</div>
        <div class="detail-value"><span class="badge b-purple">${r.canal}</span></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Telefone</div>
        <div class="detail-value">${r.tel || '—'}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">E-mail</div>
        <div class="detail-value">${r.email || '—'}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Data da Venda</div>
        <div class="detail-value">${fmtDate(r.dataVenda)}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Data de Entrada</div>
        <div class="detail-value">${fmtDate(r.dataEntrada)}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Anúncio que gerou a venda</div>
        <div class="detail-value">${r.anuncio}</div>
      </div>
    </div>`;
}

// ── CANAIS & PRODUTOS ───────────────────────────────────────────
function renderCanais() {
  const rows = getData();
  if(!rows.length) {
    document.getElementById('pg-canais').innerHTML = emptyHTML('📈','Sem dados para este período','');
    return;
  }

  const fechados = rows.filter(r => r.fechado);
  const rec = fechados.reduce((s,r) => s+r.valor, 0);

  const canais = {};
  fechados.forEach(r => { canais[r.canal] = (canais[r.canal]||0)+r.valor; });
  const cEntries = Object.entries(canais).sort((a,b)=>b[1]-a[1]);
  const maxC = cEntries[0]?cEntries[0][1]:1;

  const prods = {};
  fechados.forEach(r => { prods[r.produto] = (prods[r.produto]||0)+r.valor; });
  const pEntries = Object.entries(prods).sort((a,b)=>b[1]-a[1]);
  const maxP = pEntries[0]?pEntries[0][1]:1;

  const barColors = ['#9B6BFF','#4ade80','#60a5fa','#fbbf24','#f87171','#f472b6'];

  document.getElementById('pg-canais').innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:6px;">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 15l6 6m-11-4a7 7 0 110-14 7 7 0 010 14z"/></svg>
      Clique em qualquer canal, produto ou linha da tabela para ver os clientes detalhados (considerando apenas vendas fechadas)
    </div>

    <div class="stats-row anim-in" style="grid-template-columns:repeat(${Math.min(cEntries.length,4)},1fr)">
      ${cEntries.slice(0,4).map(([c,v],i) => {
        const cnt = fechados.filter(r=>r.canal===c).length;
        return `<div class="stat-card clickable" onclick="openDrawer('canal','${c.replace(/'/g,"\\'")}')">
          <div class="stat-label">${c}</div>
          <div class="stat-value" style="color:${barColors[i]};font-size:1.1rem;">R$${fmtK(v).replace('R$','')}</div>
          <div class="stat-sub">${cnt} venda${cnt!==1?'s':''} · ${rec ? Math.round(v/rec*100) : 0}% da receita</div>
          <div style="font-size:10px;color:var(--purple-bright);margin-top:6px;">Ver clientes →</div>
        </div>`;
      }).join('')}
    </div>

    <div class="grid2 anim-in">
      <div class="card">
        <div class="card-title">Receita por Canal <span style="font-weight:400;opacity:.5;font-size:9px;margin-left:4px;">· clique para detalhar</span></div>
        ${cEntries.map(([c,v],i) => `
        <div class="bar-item clickable" onclick="openDrawer('canal','${c.replace(/'/g,"\\'")}')">
          <div class="bar-head">
            <span style="display:flex;align-items:center;gap:6px;">${c} <span style="font-size:10px;color:var(--muted);">${fechados.filter(r=>r.canal===c).length} vendas</span></span>
            <span class="bar-val">R$${fmt(v)}</span>
          </div>
          <div class="pb"><div class="pf" data-w="${Math.round(v/maxC*100)}%" style="width:0%;background:${barColors[i%barColors.length]};"></div></div>
        </div>`).join('')}
      </div>
      <div class="card">
        <div class="card-title">Receita por Produto <span style="font-weight:400;opacity:.5;font-size:9px;margin-left:4px;">· clique para detalhar</span></div>
        ${pEntries.map(([p,v],i) => `
        <div class="bar-item clickable" onclick="openDrawer('produto','${p.replace(/'/g,"\\'")}')">
          <div class="bar-head">
            <span style="display:flex;align-items:center;gap:6px;">${p} <span style="font-size:10px;color:var(--muted);">${fechados.filter(r=>r.produto===p).length} vendas</span></span>
            <span class="bar-val">R$${fmt(v)}</span>
          </div>
          <div class="pb"><div class="pf" data-w="${Math.round(v/maxP*100)}%" style="width:0%;background:${barColors[i%barColors.length]};"></div></div>
        </div>`).join('')}
      </div>
    </div>

    <div class="section-title">Vendas por Canal</div>
    <div class="card">
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr>
            <th>Canal</th><th>Qtd Vendas</th><th>Receita</th><th>Ticket Médio</th><th>% Receita</th><th></th>
          </tr></thead>
          <tbody>
            ${cEntries.map(([c,v]) => {
              const cnt = fechados.filter(r=>r.canal===c).length;
              return `<tr class="clickable-row" onclick="openDrawer('canal','${c.replace(/'/g,"\\'")}')">
                <td><span class="badge b-purple">${c}</span></td>
                <td style="font-weight:600;">${cnt}</td>
                <td style="font-weight:600;color:var(--green);">R$${fmt(v)}</td>
                <td class="muted">R$${fmt(cnt?v/cnt:0)}</td>
                <td class="muted">${rec?Math.round(v/rec*100):0}%</td>
                <td style="color:var(--purple-bright);font-size:11px;">Ver →</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="section-title">Vendas por Produto</div>
    <div class="card">
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr>
            <th>Produto</th><th>Qtd Vendas</th><th>Receita</th><th>Ticket Médio</th><th>% Receita</th><th></th>
          </tr></thead>
          <tbody>
            ${pEntries.map(([p,v]) => {
              const cnt = fechados.filter(r=>r.produto===p).length;
              return `<tr class="clickable-row" onclick="openDrawer('produto','${p.replace(/'/g,"\\'")}')">
                <td style="font-size:13px;">${p}</td>
                <td style="font-weight:600;">${cnt}</td>
                <td style="font-weight:600;color:var(--green);">R$${fmt(v)}</td>
                <td class="muted">R$${fmt(cnt?v/cnt:0)}</td>
                <td class="muted">${rec?Math.round(v/rec*100):0}%</td>
                <td style="color:var(--purple-bright);font-size:11px;">Ver →</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;

  animarBarras(document.getElementById('pg-canais'));
}

// ── DRAWER ───────────────────────────────────────────────────────
let drawerExpanded = {};

function openDrawer(tipo, valor) {
  drawerExpanded = {};
  const rows = getData().filter(r => r.fechado);
  const filtered = tipo === 'canal'
    ? rows.filter(r => r.canal === valor)
    : rows.filter(r => r.produto === valor);

  const total = filtered.reduce((s,r) => s+r.valor, 0);
  const cnt = filtered.length;

  document.getElementById('drawer-title').textContent =
    (tipo === 'canal' ? '📡 Canal: ' : '📦 Produto: ') + valor;
  document.getElementById('drawer-sub').textContent =
    `${cnt} venda${cnt!==1?'s':''} · Receita total: R$${fmt(total)} · Ticket médio: R$${fmt(cnt?total/cnt:0)}`;

  renderDrawerBody(filtered);

  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}

function renderDrawerBody(filtered) {
  document.getElementById('drawer-body').innerHTML = filtered.length
    ? filtered.map((r, i) => {
        const isOpen = drawerExpanded[i];
        return `<div class="drawer-card" onclick="toggleDrawerCard(${i})">
          <div class="drawer-card-top">
            <span class="drawer-card-name">${r.nome}</span>
            <span class="drawer-card-val">R$${fmt(r.valor)}</span>
          </div>
          <div class="drawer-card-row">
            <span class="drawer-tag">📡 ${r.canal}</span>
            <span class="drawer-tag">📦 ${r.produto}</span>
          </div>
          ${isOpen ? `
          <div class="drawer-expanded">
            ${r.tel ? `<div class="drawer-field"><div class="drawer-field-label">Telefone</div><div class="drawer-field-value">${r.tel}</div></div>` : ''}
            ${r.email ? `<div class="drawer-field"><div class="drawer-field-label">E-mail</div><div class="drawer-field-value" style="word-break:break-all;">${r.email}</div></div>` : ''}
            <div class="drawer-field" style="grid-column:1/-1"><div class="drawer-field-label">Data da Venda</div><div class="drawer-field-value">${fmtDate(r.dataVenda)}</div></div>
            <div class="drawer-field" style="grid-column:1/-1"><div class="drawer-field-label">Anúncio</div><div class="drawer-field-value">${r.anuncio}</div></div>
          </div>` : `<div style="font-size:10px;color:var(--purple-bright);margin-top:.5rem;">Clique para expandir detalhes</div>`}
        </div>`;
      }).join('')
    : `<div style="text-align:center;padding:3rem;color:var(--muted);font-size:13px;">Nenhum cliente encontrado</div>`;
}

function toggleDrawerCard(i) {
  drawerExpanded[i] = !drawerExpanded[i];
  const rows = getData().filter(r => r.fechado);
  const title = document.getElementById('drawer-title').textContent;
  const isByCanal = title.startsWith('📡');
  const valor = title.replace('📡 Canal: ','').replace('📦 Produto: ','');
  const filtered = isByCanal
    ? rows.filter(r => r.canal === valor)
    : rows.filter(r => r.produto === valor);
  renderDrawerBody(filtered);
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}

// ── UTILS ────────────────────────────────────────────────────────
function emptyHTML(icon, title, sub) {
  return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-title">${title}</div><div class="empty-sub">${sub}</div></div>`;
}

document.querySelectorAll('.page').forEach(p => {
  p.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-txt">Carregando planilha...</div></div>';
});
loadAll();
